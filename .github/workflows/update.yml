name: Aggiorna Calendario Inter Automatically

on:
  schedule:
    - cron: '0 4 * * *' # Esegue ogni giorno alle 04:00 UTC (06:00 italiane)
  workflow_dispatch: # Permette di avviarlo anche manualmente se serve

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 icalendar

      - name: Run script
        run: python main.py

      - name: Commit and push updated .ics
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add inter_tv.ics
          git commit -m "Aggiornamento automatico calendario Inter" || exit 0
          git push
