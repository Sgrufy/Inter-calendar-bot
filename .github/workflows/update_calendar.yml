name: Aggiorna Calendario Inter

on:
  schedule:
    - cron: '0 */4 * * *'  # Esegue l'aggiornamento ogni 4 ore.
  workflow_dispatch:        # Permette anche il lancio manuale

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install requests icalendar

      - name: Esegui script di aggiornamento
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          python update.py

      - name: Salva e committa le modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inter_tv.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico calendario Inter (ogni 4h)" && git push)
