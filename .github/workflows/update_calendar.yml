name: Aggiorna Calendario Inter

on:
  schedule:
    - cron: '0 */4 * * *' # Esegue l'aggiornamento ogni 4 ore.
  workflow_dispatch:      # Permette anche il lancio manuale

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install requests icalendar beautifulsoup4

      - name: Esegui script di aggiornamento
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          URL_CANALI_BLU: ${{ secrets.URL_CANALI_BLU }}
          URL_SECONDA_LISTA: ${{ secrets.URL_SECONDA_LISTA }}
          URL_TERZA_LISTA: ${{ secrets.URL_TERZA_LISTA }}
          URLS_SEI_PLAYLIST: ${{ secrets.URLS_SEI_PLAYLIST }}
        run: |
          python update.py

      - name: Salva e committa le modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inter_tv.ics index.html
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico calendario e palinsesto Inter"
          fi
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep 5
          done
